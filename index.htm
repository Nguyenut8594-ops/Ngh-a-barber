<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#111111">

  <title>Nghĩa Barber</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:#0d0d0d;
      color:#fff;
      font-family:Arial,sans-serif;
    }

    .login-box{
      width:min(90%,400px);
      margin:80px auto;
      padding:25px;
      background:#181818;
      border-radius:18px;
      box-shadow:0 10px 40px rgba(0,0,0,.5);
    }

    h1{
      text-align:center;
      margin-top:0;
    }

    input{
      width:100%;
      padding:14px;
      margin:8px 0;
      border:1px solid #333;
      border-radius:10px;
      background:#222;
      color:#fff;
      font-size:16px;
    }

    button{
      width:100%;
      padding:14px;
      margin-top:10px;
      border:0;
      border-radius:10px;
      background:#fff;
      color:#111;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    button:active{
      transform:scale(.98);
    }

    #app{
      display:none;
      padding-bottom:40px;
    }

    .top{
      padding:20px;
      background:#181818;
      border-bottom:1px solid #333;
    }

    .top h2{
      margin:0 0 5px;
    }

    .top p{
      margin:0;
      color:#aaa;
    }

    #nav{
      display:none;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      padding:15px;
    }

    #nav button{
      margin:0;
      background:#202020;
      color:#fff;
      border:1px solid #333;
    }

    .page{
      display:none;
      padding:15px;
    }

    .page.active{
      display:block;
    }

    .card{
      background:#181818;
      padding:18px;
      margin-bottom:15px;
      border-radius:15px;
      border:1px solid #292929;
    }

    .card h3{
      margin-top:0;
    }

    .logout{
      background:#b00020 !important;
      color:#fff !important;
    }

    .success{
      color:#7cff9b;
    }
  </style>
</head>

<body>

  <!-- =========================
       ĐĂNG NHẬP
  ========================== -->

  <section id="login">

    <div class="login-box">

      <h1>💈 Nghĩa Barber</h1>

      <p style="text-align:center;color:#aaa;">
        Đăng nhập hệ thống
      </p>

      <input
        id="user"
        type="text"
        placeholder="Tên đăng nhập"
        autocomplete="username"
      >

      <input
        id="pass"
        type="password"
        placeholder="Mật khẩu"
        autocomplete="current-password"
      >

      <button
        type="button"
        onclick="login()">
        Đăng nhập
      </button>

    </div>

  </section>


  <!-- =========================
       ỨNG DỤNG
  ========================== -->

  <section id="app">

    <div class="top">

      <h2>💈 Nghĩa Barber</h2>

      <p>
        Xin chào:
        <strong id="hello"></strong>
      </p>

    </div>


    <!-- MENU -->

    <div id="nav">

      <button
        type="button"
        onclick="show('home',this)">
        🏠 Trang chủ
      </button>

      <button
        type="button"
        onclick="show('employees',this)">
        👥 Nhân viên
      </button>

      <button
        type="button"
        onclick="show('services',this)">
        ✂️ Dịch vụ
      </button>

      <button
        type="button"
        onclick="show('money',this)">
        💰 Thu chi
      </button>

      <button
        type="button"
        class="logout"
        onclick="logout()">
        🚪 Đăng xuất
      </button>

    </div>


    <!-- TRANG CHỦ -->

    <div
      id="home"
      class="page active">

      <div class="card">

        <h3>🏠 Trang chủ</h3>

        <p>
          Chào mừng bạn đến với hệ thống quản lý
          <strong>Nghĩa Barber</strong>.
        </p>

        <p class="success">
          Hệ thống đăng nhập đang hoạt động.
        </p>

      </div>

    </div>


    <!-- NHÂN VIÊN -->

    <div
      id="employees"
      class="page">

      <div class="card">

        <h3>👥 Quản lý nhân viên</h3>

        <input
          id="employeeName"
          type="text"
          placeholder="Tên nhân viên"
        >

        <input
          id="employeePhone"
          type="text"
          placeholder="Số điện thoại"
        >

        <button
          type="button"
          onclick="addEmployee()">
          + Thêm nhân viên
        </button>

      </div>

      <div
        id="employeeList">
      </div>

    </div>


    <!-- DỊCH VỤ -->

    <div
      id="services"
      class="page">

      <div class="card">

        <h3>✂️ Quản lý dịch vụ</h3>

        <input
          id="serviceName"
          type="text"
          placeholder="Tên dịch vụ"
        >

        <input
          id="servicePrice"
          type="number"
          placeholder="Giá tiền"
        >

        <button
          type="button"
          onclick="addService()">
          + Thêm dịch vụ
        </button>

      </div>

      <div
        id="serviceList">
      </div>

    </div>


    <!-- THU CHI -->

    <div
      id="money"
      class="page">

      <div class="card">

        <h3>💰 Quản lý thu chi</h3>

        <input
          id="moneyNote"
          type="text"
          placeholder="Nội dung"
        >

        <input
          id="moneyAmount"
          type="number"
          placeholder="Số tiền"
        >

        <button
          type="button"
          onclick="addMoney()">
          + Thêm khoản tiền
        </button>

      </div>

      <div
        id="moneyList">
      </div>

    </div>

  </section>


  <!-- =========================
       SUPABASE
  ========================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://nwnbwhgxeidbclpywzpe.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_as-NhQ3Bzc9WL4rza6latg_eUNCOP9r";

    let supabaseClient = null;

    try {

      if(typeof supabase !== "undefined"){

        supabaseClient =
          supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
          );

      }else{

        console.log(
          "Supabase chưa tải"
        );

      }

    }catch(error){

      console.error(
        "Lỗi Supabase:",
        error
      );

    }


    // ============================
    // ĐĂNG NHẬP
    // ============================

    function login(){

      const u =
        document.getElementById("user").value.trim();

      const p =
        document.getElementById("pass").value;


      if(
        (u === "chủ" || u === "chu") &&
        p === "1234"
      ){

        document.getElementById(
          "hello"
        ).textContent =
          "Chủ tiệm";

        openApp();

        return;
      }


      if(
        u === "nv1" &&
        p === "1234"
      ){

        document.getElementById(
          "hello"
        ).textContent =
          "Nhân viên An";

        openApp();

        return;
      }


      alert(
        "Tài khoản hoặc mật khẩu chưa đúng.\n\n" +
        "Bản mẫu:\n" +
        "chủ / 1234\n" +
        "nv1 / 1234"
      );

    }


    // ============================
    // MỞ ỨNG DỤNG
    // ============================

    function openApp(){

      document.getElementById(
        "login"
      ).style.display =
        "none";

      document.getElementById(
        "app"
      ).style.display =
        "block";

      document.getElementById(
        "nav"
      ).style.display =
        "grid";

    }


    // ============================
    // ĐĂNG XUẤT
    // ============================

    function logout(){

      document.getElementById(
        "app"
      ).style.display =
        "none";

      document.getElementById(
        "login"
      ).style.display =
        "block";

      document.getElementById(
        "user"
      ).value = "";

      document.getElementById(
        "pass"
      ).value = "";

    }


    // ============================
    // CHUYỂN TRANG
    // ============================

    function show(id,el){

      document.querySelectorAll(
        ".page"
      ).forEach(
        page =>
          page.classList.remove(
            "active"
          )
      );


      const page =
        document.getElementById(id);


      if(page){

        page.classList.add(
          "active"
        );

      }

    }


    // ============================
    // NHÂN VIÊN
    // ============================

    async function addEmployee(){

  const name =
    document.getElementById("employeeName").value.trim();

  if(!name){
    alert("Vui lòng nhập tên nhân viên.");
    return;
  }

  if(!supabaseClient){
    alert("Chưa kết nối được Supabase.");
    return;
  }

  const { data, error } =
    await supabaseClient
      .from("employees")
      .insert([
        {
          name: name
        }
      ])
      .select();

  if(error){

    console.error(error);

    alert(
      "Không thể thêm nhân viên:\n" +
      error.message
    );

    return;
  }

  alert("Đã thêm nhân viên!");

  document.getElementById(
    "employeeName"
  ).value = "";

  loadEmployees();
}


    // ============================
    // DỊCH VỤ
    // ============================

    function addService(){

      const name =
        document.getElementById(
          "serviceName"
        ).value.trim();

      const price =
        document.getElementById(
          "servicePrice"
        ).value;


      if(!name){

        alert(
          "Vui lòng nhập tên dịch vụ."
        );

        return;
      }


      const box =
        document.getElementById(
          "serviceList"
        );


      const item =
        document.createElement(
          "div"
        );

      item.className =
        "card";


      item.innerHTML =
        "<h3>" +
        escapeHtml(name) +
        "</h3>" +
        "<p>💵 " +
        Number(price || 0).toLocaleString(
          "vi-VN"
        ) +
        " đ</p>";


      box.appendChild(item);


      document.getElementById(
        "serviceName"
      ).value = "";

      document.getElementById(
        "servicePrice"
      ).value = "";

    }


    // ============================
    // THU CHI
    // ============================

    function addMoney(){

      const note =
        document.getElementById(
          "moneyNote"
        ).value.trim();

      const amount =
        document.getElementById(
          "moneyAmount"
        ).value;


      if(!note){

        alert(
          "Vui lòng nhập nội dung."
        );

        return;
      }


      const box =
        document.getElementById(
          "moneyList"
        );


      const item =
        document.createElement(
          "div"
        );

      item.className =
        "card";


      item.innerHTML =
        "<h3>" +
        escapeHtml(note) +
        "</h3>" +
        "<p>💵 " +
        Number(amount || 0).toLocaleString(
          "vi-VN"
        ) +
        " đ</p>";


      box.appendChild(item);


      document.getElementById(
        "moneyNote"
      ).value = "";

      document.getElementById(
        "moneyAmount"
      ).value = "";

    }


    // ============================
    // BẢO VỆ HTML
    // ============================

    function escapeHtml(text){

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        String(text ?? "");

      return div.innerHTML;

    }

  </script>

</body>
</html>
