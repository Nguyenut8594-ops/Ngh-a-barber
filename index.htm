<!doctype html>
<html lang="vi">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta
  name="theme-color"
  content="#111111">

<title>Nghĩa Barber</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#0d0d0d;
  color:#fff;
  font-family:Arial,sans-serif;
}

button,
input,
select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.login-box{
  width:min(90%,400px);
  margin:80px auto;
  padding:25px;
  background:#181818;
  border-radius:18px;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
}

h1{
  text-align:center;
  margin-top:0;
}

input,
select{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:1px solid #333;
  border-radius:10px;
  background:#222;
  color:#fff;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#111;
  font-size:16px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

#app{
  display:none;
  padding-bottom:40px;
}

.top{
  padding:20px;
  background:#181818;
  border-bottom:1px solid #333;
}

.top h2{
  margin:0 0 5px;
}

.top p{
  margin:0;
  color:#aaa;
}

#nav{
  display:none;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:15px;
}

#nav button{
  margin:0;
  background:#202020;
  color:#fff;
  border:1px solid #333;
}

.page{
  display:none;
  padding:15px;
}

.page.active{
  display:block;
}

.card{
  background:#181818;
  padding:18px;
  margin-bottom:15px;
  border-radius:15px;
  border:1px solid #292929;
}

.card h3{
  margin-top:0;
}

.logout{
  background:#b00020 !important;
  color:#fff !important;
}

.danger{
  background:#b00020 !important;
  color:#fff !important;
}

.secondary{
  background:#292929 !important;
  color:#fff !important;
}

.success{
  color:#7cff9b;
}

.muted{
  color:#999;
}

.money{
  font-size:20px;
  font-weight:bold;
}

.service-card{
  cursor:pointer;
}

.service-card:active{
  transform:scale(.99);
}

.service-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.service-actions button{
  margin-top:8px;
}

.stat-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:#202020;
  padding:15px;
  border-radius:12px;
  border:1px solid #333;
}

.stat small{
  display:block;
  color:#999;
  margin-bottom:5px;
}

.stat strong{
  font-size:18px;
}

.employee-report{
  margin-top:10px;
}

.empty{
  text-align:center;
  color:#999;
  padding:20px;
}

@media(max-width:500px){

  .stat-grid{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<!-- =========================
     ĐĂNG NHẬP
========================== -->

<section id="login">

  <div class="login-box">

    <h1>💈 Nghĩa Barber</h1>

    <p style="text-align:center;color:#aaa;">
      Đăng nhập hệ thống
    </p>

    <input
      id="user"
      type="text"
      placeholder="Tên đăng nhập"
      autocomplete="username">

    <input
      id="pass"
      type="password"
      placeholder="Mật khẩu"
      autocomplete="current-password">

    <button
      type="button"
      onclick="login()">
      Đăng nhập
    </button>

  </div>

</section>


<!-- =========================
     ỨNG DỤNG
========================== -->

<section id="app">

  <div class="top">

    <h2>💈 Nghĩa Barber</h2>

    <p>
      Xin chào:
      <strong id="hello"></strong>
    </p>

  </div>


  <!-- =========================
       MENU
  ========================== -->

  <div id="nav">

    <button
      id="navEmployees"
      type="button"
      onclick="show('employees')">
      👥 Nhân viên
    </button>

    <button
      type="button"
      onclick="show('services')">
      ✂️ Dịch vụ
    </button>

    <button
      type="button"
      onclick="show('money')">
      💰 Thu chi
    </button>

    <button
      type="button"
      class="logout"
      onclick="logout()">
      🚪 Đăng xuất
    </button>

  </div>


  <!-- =========================
       NHÂN VIÊN
  ========================== -->

  <div
    id="employees"
    class="page">

    <div
      id="employeeManagement"
      class="card">

      <h3>👥 Thêm nhân viên</h3>

      <input
        id="employeeName"
        type="text"
        placeholder="Tên nhân viên">

      <input
        id="employeeUsername"
        type="text"
        placeholder="Tên đăng nhập">

      <input
        id="employeePassword"
        type="password"
        placeholder="Mật khẩu">

      <button
        type="button"
        onclick="addEmployee()">
        + Thêm nhân viên
      </button>

    </div>


    <div id="employeeList"></div>

    <div id="employeeReportBox"></div>

  </div>


  <!-- =========================
       DỊCH VỤ
  ========================== -->

  <div
    id="services"
    class="page">

    <div
      id="serviceManagement"
      class="card">

      <h3>✂️ Quản lý dịch vụ</h3>

      <input
        id="serviceName"
        type="text"
        placeholder="Tên dịch vụ">

      <input
        id="servicePrice"
        type="number"
        placeholder="Giá tiền">

      <input
        id="servicePercent"
        type="number"
        placeholder="% nhân viên"
        min="0"
        max="100">

      <button
        type="button"
        onclick="addService()">
        + Thêm dịch vụ
      </button>

    </div>


    <div id="serviceList"></div>

  </div>


  <!-- =========================
       THU CHI
  ========================== -->

  <div
    id="money"
    class="page">

    <div class="card">

      <h3>💰 Tổng quan</h3>

      <div class="stat-grid">

        <div class="stat">

          <small>Doanh thu hôm nay</small>

          <strong id="todayRevenue">
            0 đ
          </strong>

        </div>

        <div class="stat">

          <small>Doanh thu tháng này</small>

          <strong id="monthRevenue">
            0 đ
          </strong>

        </div>

        <div class="stat">

          <small>Tiền nhân viên hôm nay</small>

          <strong id="todayCommission">
            0 đ
          </strong>

        </div>

        <div class="stat">

          <small>Tiền nhân viên tháng này</small>

          <strong id="monthCommission">
            0 đ
          </strong>

        </div>

      </div>

    </div>


    <div
      id="manualMoneyBox"
      class="card">

      <h3>💵 Thêm khoản thu / chi</h3>

      <input
        id="moneyNote"
        type="text"
        placeholder="Nội dung">

      <input
        id="moneyAmount"
        type="number"
        placeholder="Số tiền">

      <select id="moneyType">

        <option value="thu">
          Thu
        </option>

        <option value="chi">
          Chi
        </option>

      </select>

      <button
        type="button"
        onclick="addMoney()">
        + Lưu khoản tiền
      </button>

    </div>


    <div class="card">

      <h3>📋 Giao dịch hôm nay</h3>

      <div id="moneyList"></div>

    </div>


    <div class="card">

      <h3>✂️ Dịch vụ đã thực hiện tháng này</h3>

      <div id="serviceRecordList"></div>

    </div>

  </div>

</section>


<!-- =========================
     SUPABASE
========================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


// ============================
// SUPABASE
// ============================

const SUPABASE_URL =
  "https://nwnbwhgxeidbclpywzpe.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_as-NhQ3Bzc9WL4rza6latg_eUNCOP9r";

let supabaseClient = null;

try{

  if(typeof supabase !== "undefined"){

    supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

  }

}catch(error){

  console.error(
    "Lỗi Supabase:",
    error
  );

}


// ============================
// BIẾN HỆ THỐNG
// ============================

let currentEmployee = null;

let currentservices = [];


// ============================
// KIỂM TRA SUPABASE
// ============================

function checkSupabase(){

  if(!supabaseClient){

    alert(
      "Chưa kết nối được Supabase."
    );

    return false;

  }

  return true;

}


// ============================
// ĐỊNH DẠNG TIỀN
// ============================

function money(value){

  return Number(value || 0)
    .toLocaleString("vi-VN") + " đ";

}


// ============================
// ĐĂNG NHẬP
// ============================

async function login(){

  const u =
    document
      .getElementById("user")
      .value
      .trim();

  const p =
    document
      .getElementById("pass")
      .value;


  if(!u || !p){

    alert(
      "Vui lòng nhập tên đăng nhập và mật khẩu."
    );

    return;

  }


  // ==========================
  // CHỦ
  // ==========================

  if(
    (u === "chủ" || u === "chu") &&
    p === "1234"
  ){

    currentEmployee = null;

    document
      .getElementById("hello")
      .textContent =
      "Chủ tiệm";

    openApp();

    return;

  }


  // ==========================
  // NHÂN VIÊN
  // ==========================

  if(!checkSupabase()) return;


  const result =
    await supabaseClient
      .from("employees")
      .select(
        'id, "Name", username, password'
      )
      .eq(
        "username",
        u
      )
      .eq(
        "password",
        p
      )
      .maybeSingle();


  if(result.error){

    alert(
      "Không thể kiểm tra tài khoản:\n\n" +
      result.error.message
    );

    return;

  }


  if(!result.data){

    alert(
      "Tài khoản hoặc mật khẩu chưa đúng."
    );

    return;

  }


  currentEmployee =
    result.data;


  document
    .getElementById("hello")
    .textContent =
    "Nhân viên " +
    result.data.Name;


  openApp();

}


// ============================
// MỞ ỨNG DỤNG
// ============================

function openApp(){

  document
    .getElementById("login")
    .style.display =
    "none";

  document
    .getElementById("app")
    .style.display =
    "block";

  document
    .getElementById("nav")
    .style.display =
    "grid";


  const employeeButton =
    document.getElementById(
      "navEmployees"
    );

  const employeeManagement =
    document.getElementById(
      "employeeManagement"
    );

  const serviceManagement =
    document.getElementById(
      "serviceManagement"
    );


  if(currentEmployee){

    employeeButton.style.display =
      "none";

    employeeManagement.style.display =
      "none";

    serviceManagement.style.display =
      "none";

    show("services");

  }else{

    employeeButton.style.display =
      "block";

    employeeManagement.style.display =
      "block";

    serviceManagement.style.display =
      "block";

    show("services");

  }


  loadEmployees();

  loadservices();

  loadMoney();

}


// ============================
// ĐĂNG XUẤT
// ============================

function logout(){

  currentEmployee = null;

  document
    .getElementById("app")
    .style.display =
    "none";

  document
    .getElementById("login")
    .style.display =
    "block";

  document
    .getElementById("user")
    .value =
    "";

  document
    .getElementById("pass")
    .value =
    "";

  document
    .getElementById("hello")
    .textContent =
    "";

}


// ============================
// CHUYỂN TRANG
// ============================

function show(id){

  document
    .querySelectorAll(".page")
    .forEach(
      page =>
        page.classList.remove("active")
    );


  const page =
    document.getElementById(id);


  if(page){

    page.classList.add("active");

  }


  if(id === "services"){

    loadservices();

  }


  if(id === "money"){

    loadMoney();

  }


  if(id === "employees"){

    loadEmployees();

  }

}


// ============================
// NHÂN VIÊN
// ============================

async function loadEmployees(){

  if(!checkSupabase()) return;


  const box =
    document.getElementById(
      "employeeList"
    );


  if(!box) return;


  const result =
    await supabaseClient
      .from("employees")
      .select(
        'id, "Name", username, created_at'
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(result.error){

    box.innerHTML =
      "<div class='card'>" +
      "<h3>❌ Lỗi tải nhân viên</h3>" +
      "<p>" +
      escapeHtml(
        result.error.message
      ) +
      "</p>" +
      "</div>";

    return;

  }


  box.innerHTML = "";


  if(
    !result.data ||
    result.data.length === 0
  ){

    box.innerHTML =
      "<div class='card empty'>" +
      "Chưa có nhân viên." +
      "</div>";

    return;

  }


  result.data.forEach(
    employee => {

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "card";


      item.innerHTML =
        "<h3>👤 " +
        escapeHtml(
          employee.Name
        ) +
        "</h3>" +

        "<p class='muted'>" +
        "Tên đăng nhập: " +
        escapeHtml(
          employee.username
        ) +
        "</p>" +

        "<button " +
        "type='button' " +
        "onclick='showEmployeeReport(" +
        employee.id +
        "," +
        JSON.stringify(
          employee.Name
        ) +
        ")'>" +
        "📊 Xem doanh thu" +
        "</button>";


      box.appendChild(
        item
      );

    }
  );

}


// ============================
// THÊM NHÂN VIÊN
// ============================

async function addEmployee(){

  if(currentEmployee){

    alert(
      "Nhân viên không có quyền thêm nhân viên."
    );

    return;

  }


  const name =
    document
      .getElementById("employeeName")
      .value
      .trim();


  const username =
    document
      .getElementById("employeeUsername")
      .value
      .trim();


  const password =
    document
      .getElementById("employeePassword")
      .value;


  if(!name){

    alert(
      "Vui lòng nhập tên nhân viên."
    );

    return;

  }


  if(!username){

    alert(
      "Vui lòng nhập tên đăng nhập."
    );

    return;

  }


  if(!password){

    alert(
      "Vui lòng nhập mật khẩu."
    );

    return;

  }


  if(!checkSupabase()) return;


  const result =
    await supabaseClient
      .from("employees")
      .insert([
        {
          "Name": name,
          username: username,
          password: password
        }
      ]);


  if(result.error){

    alert(
      "LỖI THÊM NHÂN VIÊN:\n\n" +
      result.error.message
    );

    return;

  }


  alert(
    "Đã thêm nhân viên!"
  );


  document
    .getElementById("employeeName")
    .value = "";

  document
    .getElementById("employeeUsername")
    .value = "";

  document
    .getElementById("employeePassword")
    .value = "";


  loadEmployees();

}


// ============================
// BÁO CÁO NHÂN VIÊN
// ============================

async function showEmployeeReport(
  employeeId,
  employeeName
){

  if(currentEmployee){

    return;

  }


  const box =
    document.getElementById(
      "employeeReportBox"
    );


  if(!box) return;


  box.innerHTML =
    "<div class='card'>" +
    "⏳ Đang tải báo cáo..." +
    "</div>";


  if(!checkSupabase()) return;


  const result =
    await supabaseClient
      .from("service_records")
      .select(
        "id, created_at, employee_name, service_name, price, quantity, commission"
      )
      .eq(
        "employee_name",
        employeeName
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(result.error){

    box.innerHTML =
      "<div class='card'>" +
      "<h3>❌ Lỗi báo cáo</h3>" +
      "<p>" +
      escapeHtml(
        result.error.message
      ) +
      "</p>" +
      "</div>";

    return;

  }


  const records =
    result.data || [];


  const now =
    new Date();


  let todayTotal = 0;
  let monthTotal = 0;
  let monthCommission = 0;


  records.forEach(
    record => {

      const d =
        new Date(
          record.created_at
        );


      const price =
        Number(
          record.price || 0
        ) *
        Number(
          record.quantity || 1
        );


      const commission =
        Number(
          record.commission || 0
        );


      if(
        d.toDateString() ===
        now.toDateString()
      ){

        todayTotal += price;

      }


      if(
        d.getMonth() === now.getMonth() &&
        d.getFullYear() === now.getFullYear()
      ){

        monthTotal += price;

        monthCommission +=
          commission;

      }

    }
  );


  let html =

    "<div class='card employee-report'>" +

    "<h3>📊 " +
    escapeHtml(
      employeeName
    ) +
    "</h3>" +

    "<div class='stat-grid'>" +

    "<div class='stat'>" +
    "<small>Doanh thu hôm nay</small>" +
    "<strong>" +
    money(todayTotal) +
    "</strong>" +
    "</div>" +

    "<div class='stat'>" +
    "<small>Doanh thu tháng</small>" +
    "<strong>" +
    money(monthTotal) +
    "</strong>" +
    "</div>" +

    "<div class='stat'>" +
    "<small>Tiền nhân viên tháng</small>" +
    "<strong>" +
    money(monthCommission) +
    "</strong>" +
    "</div>" +

    "</div>" +

    "<h3 style='margin-top:20px;'>" +
    "📋 Chi tiết" +
    "</h3>";


  if(records.length === 0){

    html +=
      "<p class='empty'>" +
      "Chưa có dịch vụ nào." +
      "</p>";

  }else{

    records.forEach(
      record => {

        const d =
          new Date(
            record.created_at
          );


        const price =
          Number(
            record.price || 0
          );


        const commission =
          Number(
            record.commission || 0
          );


        const percent =
          price > 0
            ? (commission / price) * 100
            : 0;


        html +=

          "<div class='card'>" +

          "<strong>✂️ " +
          escapeHtml(
            record.service_name
          ) +
          "</strong>" +

          "<p>📅 " +
          d.toLocaleString(
            "vi-VN"
          ) +
          "</p>" +

          "<p>💵 Giá: " +
          money(
            price *
            Number(
              record.quantity || 1
            )
          ) +
          "</p>" +

          "<p>👤 % nhân viên: " +
          percent.toLocaleString(
            "vi-VN",
            {
              maximumFractionDigits:2
            }
          ) +
          "%</p>" +

          "<p>💰 Nhân viên nhận: " +
          money(
            commission
          ) +
          "</p>" +

          "</div>";

      }
    );

  }


  html += "</div>";


  box.innerHTML =
    html;


  box.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}


// ============================
// DỊCH VỤ
// ============================

async function loadservices(){

  const box =
    document.getElementById(
      "serviceList"
    );


  if(!box) return;


  if(!checkSupabase()) return;


  box.innerHTML =
    "<div class='card empty'>" +
    "⏳ Đang tải dịch vụ..." +
    "</div>";


  const result =
    await supabaseClient
      .from("service")
      .select(
        "id, name, price, employee_percent, created_at, active, description, sort_order"
      )
      .order(
        "id",
        {
          ascending:true
        }
      );


  if(result.error){

    console.error(
      "LỖI SERVICE:",
      result.error
    );


    box.innerHTML =
      "<div class='card'>" +

      "<h3>❌ Không tải được dịch vụ</h3>" +

      "<p>" +
      escapeHtml(
        result.error.message
      ) +
      "</p>" +

      "</div>";

    return;

  }


  currentservices =
    result.data || [];


  box.innerHTML = "";


  const services =
    currentservices.filter(
      service =>
        service.active !== false
    );


  if(services.length === 0){

    box.innerHTML =
      "<div class='card empty'>" +
      "Chưa có dịch vụ." +
      "</div>";

    return;

  }


  services.forEach(
    service => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "card service-card";


      const percent =
        Number(
          service.employee_percent || 0
        );


      const price =
        Number(
          service.price || 0
        );


      if(currentEmployee){

        item.onclick =
          function(){

            recordService(
              service
            );

          };


        item.innerHTML =

          "<h3>✂️ " +
          escapeHtml(
            service.name
          ) +
          "</h3>" +

          "<p>💵 Giá: " +
          money(price) +
          "</p>" +

          "<p>👤 Bạn nhận: " +
          money(
            price *
            percent /
            100
          ) +
          "</p>" +

          "<p class='success'>" +
          "👆 Bấm để ghi nhận dịch vụ" +
          "</p>";

      }else{

        item.innerHTML =

          "<h3>✂️ " +
          escapeHtml(
            service.name
          ) +
          "</h3>" +

          "<p>💵 Giá: " +
          money(price) +
          "</p>" +

          "<p>👤 Nhân viên: " +
          percent +
          "%</p>" +

          "<div class='service-actions'>" +

          "<button " +
          "type='button' " +
          "onclick='editService(" +
          service.id +
          ")'>" +
          "✏️ Sửa" +
          "</button>" +

          "<button " +
          "type='button' " +
          "class='danger' " +
          "onclick='deleteService(" +
          service.id +
          ")'>" +
          "🗑️ Xóa" +
          "</button>" +

          "</div>";

      }


      box.appendChild(
        item
      );

    }
  );

}


// ============================
// THÊM DỊCH VỤ
// ============================

async function addService(){

  if(currentEmployee){

    alert(
      "Nhân viên không có quyền thêm dịch vụ."
    );

    return;

  }


  const name =
    document
      .getElementById("serviceName")
      .value
      .trim();


  const price =
    Number(
      document
        .getElementById("servicePrice")
        .value
    );


  const employeePercent =
    Number(
      document
        .getElementById("servicePercent")
        .value
    );


  if(!name){

    alert(
      "Vui lòng nhập tên dịch vụ."
    );

    return;

  }


  if(
    !price ||
    price <= 0
  ){

    alert(
      "Vui lòng nhập giá dịch vụ."
    );

    return;

  }


  if(
    isNaN(employeePercent) ||
    employeePercent < 0 ||
    employeePercent > 100
  ){

    alert(
      "Vui lòng nhập % nhân viên từ 0 đến 100."
    );

    return;

  }


  if(!checkSupabase()) return;


  const result =
    await supabaseClient
      .from("service")
      .insert([
        {
          name:name,
          price:price,
          employee_percent:
            employeePercent,
          active:true
        }
      ]);


  if(result.error){

    alert(
      "LỖI THÊM DỊCH VỤ:\n\n" +
      result.error.message
    );

    return;

  }


  alert(
    "Đã thêm dịch vụ!"
  );


  document
    .getElementById("serviceName")
    .value = "";

  document
    .getElementById("servicePrice")
    .value = "";

  document
    .getElementById("servicePercent")
    .value = "";


  loadservices();

}


// ============================
// SỬA DỊCH VỤ
// ============================

async function editService(id){

  if(currentEmployee){

    alert(
      "Nhân viên không có quyền sửa dịch vụ."
    );

    return;

  }


  const service =
    currentservices.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if(!service){

    alert(
      "Không tìm thấy dịch vụ."
    );

    return;

  }


  const newName =
    prompt(
      "Tên dịch vụ:",
      service.name
    );


  if(newName === null)
    return;


  const newPriceText =
    prompt(
      "Giá dịch vụ:",
      service.price
    );


  if(newPriceText === null)
    return;


  const newPercentText =
    prompt(
      "% nhân viên:",
      service.employee_percent
    );


  if(newPercentText === null)
    return;


  const newPrice =
    Number(
      newPriceText
    );


  const newPercent =
    Number(
      newPercentText
    );


  if(
    !newName.trim() ||
    !newPrice ||
    newPrice <= 0 ||
    isNaN(newPercent) ||
    newPercent < 0 ||
    newPercent > 100
  ){

    alert(
      "Thông tin dịch vụ không hợp lệ."
    );

    return;

  }


  const result =
    await supabaseClient
      .from("service")
      .update({
        name:newName.trim(),
        price:newPrice,
        employee_percent:
          newPercent
      })
      .eq(
        "id",
        id
      );


  if(result.error){

    alert(
      "Lỗi sửa dịch vụ:\n\n" +
      result.error.message
    );

    return;

  }


  alert(
    "Đã sửa dịch vụ!"
  );


  loadservices();

}


// ============================
// XÓA DỊCH VỤ
// ============================

async function deleteService(id){

  if(currentEmployee){

    alert(
      "Nhân viên không có quyền xóa dịch vụ."
    );

    return;

  }


  const service =
    currentservices.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if(!service) return;


  const ok =
    confirm(
      "Bạn có chắc muốn xóa dịch vụ:\n\n" +
      service.name +
      "?"
    );


  if(!ok) return;


  const result =
    await supabaseClient
      .from("service")
      .delete()
      .eq(
        "id",
        id
      );


  if(result.error){

    alert(
      "Lỗi xóa dịch vụ:\n\n" +
      result.error.message
    );

    return;

  }


  alert(
    "Đã xóa dịch vụ!"
  );


  loadservices();

}


// ============================
// GHI NHẬN DỊCH VỤ
// ============================

async function recordService(service){

  if(!currentEmployee){

    return;

  }


  if(!checkSupabase()) return;


  const price =
    Number(
      service.price || 0
    );


  const percent =
    Number(
      service.employee_percent || 0
    );


  const commission =
    price *
    percent /
    100;


  const ok =
    confirm(
      "Ghi nhận dịch vụ?\n\n" +

      service.name +

      "\nGiá: " +
      money(price) +

      "\nBạn nhận: " +
      money(commission)
    );


  if(!ok) return;


  const result =
    await supabaseClient
      .from("service_records")
      .insert([
        {
          employee_name:
            currentEmployee.Name,

          service_name:
            service.name,

          price:
            price,

          quantity:
            1,

          commission:
            commission
        }
      ]);


  if(result.error){

    alert(
      "Không thể ghi nhận dịch vụ:\n\n" +
      result.error.message
    );

    return;

  }


  alert(
    "Đã ghi nhận dịch vụ!\n\n" +
    service.name +
    "\nBạn nhận: " +
    money(commission)
  );


  loadMoney();

}


// ============================
// THU CHI
// ============================

async function loadMoney(){

  if(!checkSupabase()) return;

  await loadMoneySummary();

  await loadManualMoney();

  await loadServiceRecords();

}


// ============================
// TỔNG DOANH THU
// ============================

async function loadMoneySummary(){

  let query =
    supabaseClient
      .from("service_records")
      .select(
        "price, quantity, commission, created_at"
      );


  if(currentEmployee){

    query =
      query.eq(
        "employee_name",
        currentEmployee.Name
      );

  }


  const result =
    await query;


  if(result.error){

    console.error(
      result.error
    );

    return;

  }


  const records =
    result.data || [];


  const now =
    new Date();


  let todayRevenue = 0;
  let monthRevenue = 0;
  let todayCommission = 0;
  let monthCommission = 0;


  records.forEach(
    record => {

      const d =
        new Date(
          record.created_at
        );


      const price =
        Number(
          record.price || 0
        ) *
        Number(
          record.quantity || 1
        );


      const commission =
        Number(
          record.commission || 0
        );


      if(
        d.toDateString() ===
        now.toDateString()
      ){

        todayRevenue += price;

        todayCommission +=
          commission;

      }


      if(
        d.getMonth() ===
          now.getMonth() &&
        d.getFullYear() ===
          now.getFullYear()
      ){

        monthRevenue += price;

        monthCommission +=
          commission;

      }

    }
  );


  document
    .getElementById("todayRevenue")
    .textContent =
    money(todayRevenue);


  document
    .getElementById("monthRevenue")
    .textContent =
    money(monthRevenue);


  document
    .getElementById("todayCommission")
    .textContent =
    money(todayCommission);


  document
    .getElementById("monthCommission")
    .textContent =
    money(monthCommission);

}


// ============================
// THU CHI THỦ CÔNG
// ============================

async function loadManualMoney(){

  const box =
    document.getElementById(
      "moneyList"
    );


  if(!box) return;


  const result =
    await supabaseClient
      .from("money")
      .select("*")
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(result.error){

    box.innerHTML =
      "<div class='empty'>" +
      "Không tải được dữ liệu thu chi.<br><br>" +
      escapeHtml(
        result.error.message
      ) +
      "</div>";

    return;

  }


  const today =
    new Date()
      .toDateString();


  const records =
    (result.data || [])
      .filter(
        record =>
          new Date(
            record.created_at
          ).toDateString() ===
          today
      );


  if(records.length === 0){

    box.innerHTML =
      "<div class='empty'>" +
      "Hôm nay chưa có khoản thu/chi thủ công." +
      "</div>";

    return;

  }


  box.innerHTML = "";


  records.forEach(
    record => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "card";


      const sign =
        record.type === "chi"
          ? "-"
          : "+";


      item.innerHTML =

        "<h3>💰 " +
        escapeHtml(
          record.note || ""
        ) +
        "</h3>" +

        "<p class='money'>" +
        sign +
        money(
          record.amount
        ) +
        "</p>" +

        "<p class='muted'>" +
        "Loại: " +
        escapeHtml(
          record.type || ""
        ) +
        "</p>";

      box.appendChild(
        item
      );

    }
  );

}


// ============================
// THÊM KHOẢN THU CHI
// ============================

async function addMoney(){

  const note =
    document
      .getElementById("moneyNote")
      .value
      .trim();


  const amount =
    Number(
      document
        .getElementById("moneyAmount")
        .value
    );


  const type =
    document
      .getElementById("moneyType")
      .value;


  if(!note){

    alert(
      "Vui lòng nhập nội dung."
    );

    return;

  }


  if(
    !amount ||
    amount <= 0
  ){

    alert(
      "Vui lòng nhập số tiền hợp lệ."
    );

    return;

  }


  if(!checkSupabase()) return;


  const result =
    await supabaseClient
      .from("money")
      .insert([
        {
          type:type,
          amount:amount,
          note:note
        }
      ]);


  if(result.error){

    alert(
      "Không thể lưu khoản tiền:\n\n" +
      result.error.message
    );

    return;

  }


  alert(
    "Đã lưu khoản tiền!"
  );


  document
    .getElementById("moneyNote")
    .value = "";

  document
    .getElementById("moneyAmount")
    .value = "";


  loadMoney();

}


// ============================
// DỊCH VỤ ĐÃ THỰC HIỆN
// ============================

async function loadServiceRecords(){

  const box =
    document.getElementById(
      "serviceRecordList"
    );


  if(!box) return;


  let query =
    supabaseClient
      .from("service_records")
      .select(
        "id, created_at, employee_name, service_name, price, quantity, commission"
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );


  if(currentEmployee){

    query =
      query.eq(
        "employee_name",
        currentEmployee.Name
      );

  }


  const result =
    await query;


  if(result.error){

    box.innerHTML =
      "<div class='empty'>" +
      "Không tải được lịch sử dịch vụ.<br><br>" +
      escapeHtml(
        result.error.message
      ) +
      "</div>";

    return;

  }


  const now =
    new Date();


  const records =
    (result.data || [])
      .filter(
        record => {

          const d =
            new Date(
              record.created_at
            );


          return (
            d.getMonth() ===
              now.getMonth() &&
            d.getFullYear() ===
              now.getFullYear()
          );

        }
      );


  if(records.length === 0){

    box.innerHTML =
      "<div class='empty'>" +
      "Tháng này chưa có dịch vụ." +
      "</div>";

    return;

  }


  box.innerHTML = "";


  records.forEach(
    record => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "card";


      const d =
        new Date(
          record.created_at
        );


      const price =
        Number(
          record.price || 0
        ) *
        Number(
          record.quantity || 1
        );


      const commission =
        Number(
          record.commission || 0
        );


      item.innerHTML =

        "<h3>✂️ " +
        escapeHtml(
          record.service_name
        ) +
        "</h3>" +

        "<p>👤 " +
        escapeHtml(
          record.employee_name
        ) +
        "</p>" +

        "<p>📅 " +
        d.toLocaleString(
          "vi-VN"
        ) +
        "</p>" +

        "<p>💵 Giá: " +
        money(price) +
        "</p>" +

        "<p>💰 Nhân viên nhận: " +
        money(commission) +
        "</p>";

      box.appendChild(
        item
      );

    }
  );

}


// ============================
// BẢO VỆ HTML
// ============================

function escapeHtml(text){

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    String(
      text ?? ""
    );


  return div.innerHTML;

}
