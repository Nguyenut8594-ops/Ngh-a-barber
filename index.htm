<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#111111">

  <title>Nghĩa Barber</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:#0d0d0d;
      color:#fff;
      font-family:Arial,sans-serif;
    }

    .login-box{
      width:min(90%,400px);
      margin:80px auto;
      padding:25px;
      background:#181818;
      border-radius:18px;
      box-shadow:0 10px 40px rgba(0,0,0,.5);
    }

    h1{
      text-align:center;
      margin-top:0;
    }

    input{
      width:100%;
      padding:14px;
      margin:8px 0;
      border:1px solid #333;
      border-radius:10px;
      background:#222;
      color:#fff;
      font-size:16px;
    }

    button{
      width:100%;
      padding:14px;
      margin-top:10px;
      border:0;
      border-radius:10px;
      background:#fff;
      color:#111;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    button:active{
      transform:scale(.98);
    }

    #app{
      display:none;
      padding-bottom:40px;
    }

    .top{
      padding:20px;
      background:#181818;
      border-bottom:1px solid #333;
    }

    .top h2{
      margin:0 0 5px;
    }

    .top p{
      margin:0;
      color:#aaa;
    }

    #nav{
      display:none;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      padding:15px;
    }

    #nav button{
      margin:0;
      background:#202020;
      color:#fff;
      border:1px solid #333;
    }

    .page{
      display:none;
      padding:15px;
    }

    .page.active{
      display:block;
    }

    .card{
      background:#181818;
      padding:18px;
      margin-bottom:15px;
      border-radius:15px;
      border:1px solid #292929;
    }

    .card h3{
      margin-top:0;
    }

    .logout{
      background:#b00020 !important;
      color:#fff !important;
    }

    .success{
      color:#7cff9b;
    }
  </style>
</head>

<body>

  <!-- =========================
       ĐĂNG NHẬP
  ========================== -->

  <section id="login">

    <div class="login-box">

      <h1>💈 Nghĩa Barber</h1>

      <p style="text-align:center;color:#aaa;">
        Đăng nhập hệ thống
      </p>

      <input
        id="user"
        type="text"
        placeholder="Tên đăng nhập"
        autocomplete="username"
      >

      <input
        id="pass"
        type="password"
        placeholder="Mật khẩu"
        autocomplete="current-password"
      >

      <button
        type="button"
        onclick="login()">
        Đăng nhập
      </button>

    </div>

  </section>


  <!-- =========================
       ỨNG DỤNG
  ========================== -->

  <section id="app">

    <div class="top">

      <h2>💈 Nghĩa Barber</h2>

      <p>
        Xin chào:
        <strong id="hello"></strong>
      </p>

    </div>


    <!-- MENU -->

    <div id="nav">

  <button
    id="navEmployees"
    type="button"
    onclick="show('employees',this)">
    👥 Nhân viên
  </button>

  <button
    type="button"
    onclick="show('services',this)">
    ✂️ Dịch vụ
  </button>

  <button
    type="button"
    onclick="show('money',this)">
    💰 Thu chi
  </button>

  <button
    type="button"
    class="logout"
    onclick="logout()">
    🚪 Đăng xuất
  </button>

</div>


    <!-- TRANG CHỦ -->

    <div
      id="home"
      class="page active">

      <div class="card">

        <h3>🏠 Trang chủ</h3>

        <p>
          Chào mừng bạn đến với hệ thống quản lý
          <strong>Nghĩa Barber</strong>.
        </p>

        <p class="success">
          Hệ thống đăng nhập đang hoạt động.
        </p>

      </div>

    </div>


    <!-- NHÂN VIÊN -->

    <div
      id="employees"
      class="page">

      <div class="card">

        <h3>👥 Quản lý nhân viên</h3>

        <input
          id="employeeName"
          type="text"
          placeholder="Tên nhân viên"
        >

        <input
          id="employeePhone"
          type="text"
          placeholder="Số điện thoại"
        >

        <button
          type="button"
          onclick="addEmployee()">
          + Thêm nhân viên
        </button>

      </div>

      <div
        id="employeeList">
      </div>

    </div>


    <!-- DỊCH VỤ -->

    <div
      id="services"
      class="page">

      <div class="card">

        <h3>✂️ Quản lý dịch vụ</h3>

        <input
          id="serviceName"
          type="text"
          placeholder="Tên dịch vụ"
        >

        <input
          id="servicePrice"
          type="number"
          placeholder="Giá tiền"
        >

        <button
          type="button"
          onclick="addService()">
          + Thêm dịch vụ
        </button>

      </div>

      <div
        id="serviceList">
      </div>

    </div>


    <!-- THU CHI -->

    <div
      id="money"
      class="page">

      <div class=o
        <button
          type="button"
          onclick="addMoney()">
          + Thêm khoản tiền
        </button>

      </div>

      <div
        id="moneyList">
      </div>

    </div>

  </section>


  <!-- =========================
       SUPABASE
  ========================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://nwnbwhgxeidbclpywzpe.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_as-NhQ3Bzc9WL4rza6latg_eUNCOP9r";

    let supabaseClient = null;

    try {

      if(typeof supabase !== "undefined"){

        supabaseClient =
          supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
          );

      }else{

        console.log(
          "Supabase chưa tải"
        );

      }

    }catch(error){

      console.error(
        "Lỗi Supabase:",
        error
      );

    }


    // ============================
    // ĐĂNG NHẬP
    // ============================
    let currentEmployee = null;
    async function login(){

      const u =
        document.getElementById("user").value.trim();

      const p =
        document.getElementById("pass").value;


      if(
        (u === "chủ" || u === "chu") &&
        p === "1234"
      ){
        currentEmployee = null;

         document.getElementById(
          "hello"
        ).textContent =
          "Chủ tiệm";

        openApp();

        return;
      }


      if(u !== "chủ" && u !== "chu"){

  const { data, error } =
    await supabaseClient
      .from("employees")
      .select('id, "Name", username, password')
      .eq("username", u)
      .eq("password", p)
      .single();

  if(error || !data){

    alert("Tài khoản hoặc mật khẩu chưa đúng.");
    return;
  }

  currentEmployee = data;

  document.getElementById(
    "hello"
  ).textContent =
    "Nhân viên " + data.Name;

  openApp();

  return;
}
alert(
  "Tài khoản hoặc mật khẩu chưa đúng.\n\n" +
  "Chủ: chủ / 1234"
);

}

    // ============================
    // MỞ ỨNG DỤNG
    // ============================

    function openApp(){

      document.getElementById(
        "login"
      ).style.display =
        "none";

      document.getElementById(
        "app"
      ).style.display =
        "block";

      document.getElementById(
        "nav"
      ).style.display =
        "grid";
loadEmployees();
 loadServices();
    }


    // ============================
    // ĐĂNG XUẤT
    // ============================

    function logout(){

      document.getElementById(
        "app"
      ).style.display =
        "none";

      document.getElementById(
        "login"
      ).style.display =
        "block";

      document.getElementById(
        "user"
      ).value = "";

      document.getElementById(
        "pass"
      ).value = "";

    }


    // ============================
    // CHUYỂN TRANG
    // ============================

    function show(id,el){

      document.querySelectorAll(
        ".page"
      ).forEach(
        page =>
          page.classList.remove(
            "active"
          )
      );


      const page =
        document.getElementById(id);


      if(page){

        page.classList.add(
          "active"
        );

      }

    }


    // ============================
    // NHÂN VIÊN
    // ============================
async function loadEmployees(){

  const box =
    document.getElementById("employeeList");

  if(!box) return;

  const { data, error } =
    await supabaseClient
      .from("employees")
      .select("id, name, created_at")
      .order("created_at", {
        ascending: false
      });

  if(error){

    console.error(error);

    box.innerHTML =
      "<div class='card'>Không tải được danh sách nhân viên.</div>";

    return;
  }

  box.innerHTML = "";

  data.forEach(employee => {

    const item =
      document.createElement("div");

    item.className = "card";

    item.innerHTML =
      "<h3>👤 " +
      escapeHtml(employee.name) +
      "</h3>" +
      "<p>ID: " +
      escapeHtml(employee.id) +
      "</p>";

    box.appendChild(item);

  });

}
    async function addEmployee(){

  const name =
    document.getElementById("employeeName").value.trim();

  if(!name){
    alert("Vui lòng nhập tên nhân viên.");
    return;
  }

  if(!supabaseClient){
    alert("Chưa kết nối được Supabase.");
    return;
  }

  const { data, error } =
    await supabaseClient
      .from("employees")
      .insert([
        {
          name: name
        }
      ])
      .select();

  if(error){

    console.error(error);

    alert(
      "Không thể thêm nhân viên:\n" +
      error.message
    );

    return;
  }

  alert("Đã thêm nhân viên!");

  document.getElementById(
    "employeeName"
  ).value = "";

  loadEmployees();
}


    // ============================
    // DỊCH VỤ
    // ============================
async function addService(){

  const name =
    document.getElementById("serviceName").value.trim();

  const price =
    Number(
      document.getElementById("servicePrice").value
    );


  if(!name){
    alert("Vui lòng nhập tên dịch vụ.");
    return;
  }

  if(!price || price <= 0){
    alert("Vui lòng nhập giá dịch vụ.");
    return;
  }

  const { data, error } =
    await supabaseClient
      .from("services")
      .insert([
        {
          name: name,
          price: price,
          employee_percent: 50,
          active: true
        }
      ])
      .select();

  if(error){

    console.error(error);

    alert(
      "Không thể thêm dịch vụ:\n" +
      error.message
    );

    return;
  }

  alert("Đã thêm dịch vụ!");

  document.getElementById(
    "serviceName"
  ).value = "";

  document.getElementById(
    "servicePrice"
  ).value = "";

  loadServices();
}
 async function recordService(service){

  if(!currentEmployee){

    alert(
      "Chức năng này dành cho nhân viên."
    );

    return;
  }

  const price =
    Number(service.price);

  const percent =
    Number(service.employee_percent);

  const employeeAmount =
    price * percent / 100;

  const ownerAmount =
    price - employeeAmount;


  const { error } =
    await supabaseClient
      .from("service_records")
      .insert([
        {
          employee_id: currentEmployee.id,
          employee_name: currentEmployee.Name,
          service_name: service.name,
          service_price: price,
          employee_percent: percent,
          employee_amount: employeeAmount,
          owner_amount: ownerAmount
        }
      ]);


  if(error){

    console.error(error);

    alert(
      "Không thể ghi nhận dịch vụ:\n" +
      error.message
    );

    return;
  }


  const { error: moneyError } =
    await supabaseClient
      .from("money_records")
      .insert([
        {
          note:
            service.name +
            " - " +
            currentEmployee.Name,

          amount: employeeAmount,

          type: "chi",

          employee_id:
            currentEmployee.id,

          employee_name:
            currentEmployee.Name,

          employee_percent:
            percent
        }
      ]);


  if(moneyError){

    console.error(moneyError);

    alert(
      "Đã ghi dịch vụ nhưng chưa ghi được phần Thu chi:\n" +
      moneyError.message
    );

    return;
  }


  alert(
    "Đã ghi nhận dịch vụ!\n\n" +
    service.name +
    "\n" +
    "Giá: " +
    price.toLocaleString("vi-VN") +
    " đ\n" +
    "Nhân viên nhận: " +
    employeeAmount.toLocaleString("vi-VN") +
    " đ\n" +
    "Chủ nhận: " +
    ownerAmount.toLocaleString("vi-VN") +
    " đ"
  );

} 
async function loadServices(){

  const box =
    document.getElementById("serviceList");

  if(!box) return;

  const { data, error } =
    await supabaseClient
      .from("services")
      .select("id, name, price, employee_percent, active")
      .eq("active", true)
      .order("sort_order", {
        ascending: true
      })
      .order("id", {
        ascending: true
      });

  if(error){

    console.error(error);

    box.innerHTML =
      "<div class='card'>" +
      "Không tải được danh sách dịch vụ." +
      "</div>";

    return;
  }

  box.innerHTML = "";

  data.forEach(service => {

    const item =
      document.createElement("button");

    item.type = "button";

    item.className = "card";

    item.style.width = "100%";
    item.style.textAlign = "left";
    item.style.cursor = "pointer";

    item.innerHTML =
      "<h3>" +
      escapeHtml(service.name) +
      "</h3>" +

      "<p>💵 " +
      Number(service.price).toLocaleString("vi-VN") +
      " đ</p>";

    item.onclick = function(){

      recordService(service);

    };

    box.appendChild(item);

  });

}

    // ============================
    // THU CHI
    // ============================

    function addMoney(){

      const note =
        document.getElementById(
          "moneyNote"
        ).value.trim();

      const amount =
        document.getElementById(
          "moneyAmount"
        ).value;


      if(!note){

        alert(
          "Vui lòng nhập nội dung."
        );

        return;
      }


      const box =
        document.getElementById(
          "moneyList"
        );


      const item =
        document.createElement(
          "div"
        );

      item.className =
        "card";


      item.innerHTML =
        "<h3>" +
        escapeHtml(note) +
        "</h3>" +
        "<p>💵 " +
        Number(amount || 0).toLocaleString(
          "vi-VN"
        ) +
        " đ</p>";


      box.appendChild(item);


      document.getElementById(
        "moneyNote"
      ).value = "";

      document.getElementById(
        "moneyAmount"
      ).value = "";

    }


    // ============================
    // BẢO VỆ HTML
    // ============================

    function escapeHtml(text){

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        String(text ?? "");

      return div.innerHTML;

    }

  </script>

</body>
</html>
