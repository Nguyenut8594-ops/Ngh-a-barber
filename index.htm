<!doctype html>
<html lang="vi">

<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#111111">

  <title>Nghĩa Barber</title>

  <style>
    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      background:#0d0d0d;
      color:#fff;
      font-family:Arial,sans-serif;
    }

    .login-box{
      width:min(90%,400px);
      margin:80px auto;
      padding:25px;
      background:#181818;
      border-radius:18px;
      box-shadow:0 10px 40px rgba(0,0,0,.5);
    }

    h1{
      text-align:center;
      margin-top:0;
    }

    input{
      width:100%;
      padding:14px;
      margin:8px 0;
      border:1px solid #333;
      border-radius:10px;
      background:#222;
      color:#fff;
      font-size:16px;
    }

    button{
      width:100%;
      padding:14px;
      margin-top:10px;
      border:0;
      border-radius:10px;
      background:#fff;
      color:#111;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    button:active{
      transform:scale(.98);
    }

    #app{
      display:none;
      padding-bottom:40px;
    }

    .top{
      padding:20px;
      background:#181818;
      border-bottom:1px solid #333;
    }

    .top h2{
      margin:0 0 5px;
    }

    .top p{
      margin:0;
      color:#aaa;
    }

    #nav{
      display:none;
      grid-template-columns:repeat(2,1fr);
      gap:10px;
      padding:15px;
    }

    #nav button{
      margin:0;
      background:#202020;
      color:#fff;
      border:1px solid #333;
    }

    .page{
      display:none;
      padding:15px;
    }

    .page.active{
      display:block;
    }

    .card{
      background:#181818;
      padding:18px;
      margin-bottom:15px;
      border-radius:15px;
      border:1px solid #292929;
    }

    .card h3{
      margin-top:0;
    }

    .logout{
      background:#b00020 !important;
      color:#fff !important;
    }

    .success{
      color:#7cff9b;
    }
  </style>
</head>

<body>

  <!-- =========================
       ĐĂNG NHẬP
  ========================== -->

  <section id="login">

    <div class="login-box">

      <h1>💈 Nghĩa Barber</h1>

      <p style="text-align:center;color:#aaa;">
        Đăng nhập hệ thống
      </p>

      <input
        id="user"
        type="text"
        placeholder="Tên đăng nhập"
        autocomplete="username"
      >

      <input
        id="pass"
        type="password"
        placeholder="Mật khẩu"
        autocomplete="current-password"
      >

      <button
        type="button"
        onclick="login()">
        Đăng nhập
      </button>

    </div>

  </section>


  <!-- =========================
       ỨNG DỤNG
  ========================== -->

  <section id="app">

    <div class="top">

      <h2>💈 Nghĩa Barber</h2>

      <p>
        Xin chào:
        <strong id="hello"></strong>
      </p>

    </div>


    <!-- MENU -->

    <div id="nav">

  <button
    id="navEmployees"
    type="button"
    onclick="show('employees',this)">
    👥 Nhân viên
  </button>

  <button
    type="button"
    onclick="show('services',this)">
    ✂️ Dịch vụ
  </button>

  <button
    type="button"
    onclick="show('money',this)">
    💰 Thu chi
  </button>

  <button
    type="button"
    class="logout"
    onclick="logout()">
    🚪 Đăng xuất
  </button>

</div>


    <!-- TRANG CHỦ -->

    <div
      id="home"
      class="page active">

      <div class="card">

        <h3>🏠 Trang chủ</h3>

        <p>
          Chào mừng bạn đến với hệ thống quản lý
          <strong>Nghĩa Barber</strong>.
        </p>

        <p class="success">
          Hệ thống đăng nhập đang hoạt động.
        </p>

      </div>

    </div>


    <!-- NHÂN VIÊN -->

    <div
      id="employees"
      class="page">

      <div class="card">

        <h3>👥 Quản lý nhân viên</h3>

        <input
          id="employeeName"
          type="text"
          placeholder="Tên nhân viên"
        >

        <input
          id="employeePhone"
          type="text"
          placeholder="Số điện thoại"
        >

        <button
          type="button"
          onclick="addEmployee()">
          + Thêm nhân viên
        </button>

      </div>

      <div
        id="employeeList">
      </div>

    </div>


    
<!-- DỊCH VỤ -->

<div
  id="services"
  class="page">

  <div class="card">

    <h3>✂️ Quản lý dịch vụ</h3>

    <input
      id="serviceName"
      type="text"
      placeholder="Tên dịch vụ"
    >

    <input
      id="servicePrice"
      type="number"
      placeholder="Giá tiền"
    >
<input
  id="servicePercent"
  type="number"
  placeholder="% nhân viên"
  min="0"
  max="100"
>  
    <button
      type="button"
      onclick="addService()">
      + Thêm dịch vụ
    </button>

  </div>

  <div
    id="serviceList">
  </div>

</div>

    <!-- THU CHI -->

<div
  id="money"
  class="page">

  <div class="card">

    <h3>💰 Quản lý thu chi</h3>

    <input
      id="moneyNote"
      type="text"
      placeholder="Nội dung thu/chi"
    >

    <input
      id="moneyAmount"
      type="number"
      placeholder="Số tiền"
    >

    <button
      type="button"
      onclick="addMoney()">
      + Thêm khoản tiền
    </button>

  </div>

  <div
    id="moneyList">
  </div>

</div>

  </section>


  <!-- =========================
       SUPABASE
  ========================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://nwnbwhgxeidbclpywzpe.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_as-NhQ3Bzc9WL4rza6latg_eUNCOP9r";

    let supabaseClient = null;

    try {

      if(typeof supabase !== "undefined"){

        supabaseClient =
          supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
          );

      }else{

        console.log(
          "Supabase chưa tải"
        );

      }

    }catch(error){

      console.error(
        "Lỗi Supabase:",
        error
      );

    }


    // ============================
    // ĐĂNG NHẬP
    // ============================
    let currentEmployee = null;
    async function login(){

      const u =
        document.getElementById("user").value.trim();

      const p =
        document.getElementById("pass").value;


      if(
        (u === "chủ" || u === "chu") &&
        p === "1234"
      ){
        currentEmployee = null;

         document.getElementById(
          "hello"
        ).textContent =
          "Chủ tiệm";

        openApp();

        return;
      }


      if(u !== "chủ" && u !== "chu"){

  const { data, error } =
    await supabaseClient
      .from("employees")
      .select('id, "Name", username, password')
      .eq("username", u)
      .eq("password", p)
      .single();

  if(error || !data){

    alert("Tài khoản hoặc mật khẩu chưa đúng.");
    return;
  }

  currentEmployee = data;

  document.getElementById(
    "hello"
  ).textContent =
    "Nhân viên " + data.Name;

  openApp();

  return;
}
alert(
  "Tài khoản hoặc mật khẩu chưa đúng.\n\n" +
  "Chủ: chủ / 1234"
);

}

    // ============================
    // MỞ ỨNG DỤNG
    // ============================

function openApp(){
  alert("OPEN APP ĐÃ CHẠY");

  document.getElementById(
    "login"
  ).style.display =
    "none";

  document.getElementById(
    "app"
  ).style.display =
    "block";

  document.getElementById(
    "nav"
  ).style.display =
    "grid";


  const employeeButton =
    document.getElementById(
      "navEmployees"
    );


  if(currentEmployee){

    // Nhân viên không được quản lý nhân viên
    employeeButton.style.display =
      "none";

  }else{

    // Chủ được quản lý nhân viên
    employeeButton.style.display =
      "block";

  }


  loadEmployees();
  alert("OPEN APP ĐÃ CHẠY");
  alert("Đang chạy loadServices");
  loadServices();
  loadMoney();

}


    // ============================
    // ĐĂNG XUẤT
    // ============================
    

    function logout(){
      currentEmployee = null;
      
      document.getElementById(
        "app"
      ).style.display =
        "none";

      document.getElementById(
        "login"
      ).style.display =
        "block";

      document.getElementById(
        "user"
      ).value = "";

      document.getElementById(
        "pass"
      ).value = "";

    }


    // ============================
    // CHUYỂN TRANG
    // ============================

    function show(id,el){

      document.querySelectorAll(
        ".page"
      ).forEach(
        page =>
          page.classList.remove(
            "active"
          )
      );


      const page =
        document.getElementById(id);


      if(page){

        page.classList.add(
          "active"
        );

      }

    }


    // ============================
    // NHÂN VIÊN
    // ============================
async function addEmployee(){

  const name =
    document.getElementById(
      "employeeName"
    ).value.trim();

  if(!name){

    alert(
      "Vui lòng nhập tên nhân viên."
    );

    return;
  }

  if(!supabaseClient){

    alert(
      "Chưa kết nối được Supabase."
    );

    return;
  }

  const { data, error } =
    await supabaseClient
      .from("employees")
      .insert([
        {
          "Name": name
        }
      ])
      .select();

  if(error){

    console.error(
      "LỖI THÊM NHÂN VIÊN:",
      error
    );

    alert(
      "LỖI THÊM NHÂN VIÊN:\n\n" +
      "Code: " +
      (error.code || "") +
      "\n\n" +
      "Message: " +
      (error.message || "") +
      "\n\n" +
      "Details: " +
      (error.details || "")
    );

    return;
  }

  alert(
    "Đã thêm nhân viên!"
  );

  document.getElementById(
    "employeeName"
  ).value = "";

  document.getElementById(
    "employeePhone"
  ).value = "";

  loadEmployees();

}

     // ============================
    // DỊCH VỤ
   // ============================

async function loadServices(){
  
  alert("LOAD SERVICES ĐÃ CHẠY");

  const box =
    document.getElementById(
      "serviceList"
    );

  if(!box) return;

  const { data, error } =
    await supabaseClient
      .from("Service")
      .select("*");

  if(error){
    
    alert("LỖI SERVICE: " + error.message);

    console.error(
      "LỖI TẢI DỊCH VỤ:",
      error
    );

    box.innerHTML =
      "<div class='card'>" +
      "LỖI TẢI DỊCH VỤ:<br><br>" +
      "Code: " +
      (error.code || "") +
      "<br><br>" +
      "Message: " +
      (error.message || "") +
      "<br><br>" +
      "Details: " +
      (error.details || "") +
      "</div>";

    return;
  }
  console.log("DỮ LIỆU SERVICE:", data);
  box.innerHTML = "";

  data.forEach(service => {

    const item =
      document.createElement(
        "div"
      );

    item.className =
      "card";

    item.innerHTML =
      "<h3>✂️ " +
      escapeHtml(
        service.name
      ) +
      "</h3>" +

      "<p>💵 Giá: " +
      Number(
        service.price || 0
      ).toLocaleString(
        "vi-VN"
      ) +
      " đ</p>" +

      "<p>👤 Nhân viên: " +
      Number(
        service.employee_percent || 0
      ) +
      "%</p>";

    box.appendChild(item);

  });

}


async function addService(){

  const name =
    document.getElementById(
      "serviceName"
    ).value.trim();

  const price =
    Number(
      document.getElementById(
        "servicePrice"
      ).value
    );

  const employeePercent =
    Number(
      document.getElementById(
        "servicePercent"
      ).value
    );


  if(!name){

    alert(
      "Vui lòng nhập tên dịch vụ."
    );

    return;
  }


  if(!price || price <= 0){

    alert(
      "Vui lòng nhập giá dịch vụ."
    );

    return;
  }


  if(
    isNaN(employeePercent) ||
    employeePercent < 0 ||
    employeePercent > 100
  ){

    alert(
      "Vui lòng nhập % nhân viên từ 0 đến 100."
    );

    return;
  }


  if(!supabaseClient){

    alert(
      "Chưa kết nối được Supabase."
    );

    return;
  }


  const { error } =
    await supabaseClient
      .from("Service")
      .insert([
        {
          name: name,
          price: price,
          employee_percent:
            employeePercent,
          active: true
        }
      ]);


  if(error){

    console.error(
      "LỖI THÊM DỊCH VỤ:",
      error
    );

    alert(
      "LỖI THÊM DỊCH VỤ:\n\n" +
      "Code: " +
      (error.code || "") +
      "\n\n" +
      "Message: " +
      (error.message || "") +
      "\n\n" +
      "Details: " +
      (error.details || "")
    );

    return;
  }


  alert(
    "Đã thêm dịch vụ!"
  );


  document.getElementById(
    "serviceName"
  ).value = "";

  document.getElementById(
    "servicePrice"
  ).value = "";

  document.getElementById(
    "servicePercent"
  ).value = "";


  loadServices();

}

    // ============================
    // THU CHI
    // ============================
    async function loadMoney(){

  const box =

    document.getElementById(

      "moneyList"

    );

  if(!box) return;

  const { data, error } =

    await supabaseClient

      .from("Money")

      .select("*")

      .order("created_at", {

        ascending: false

      });

  if(error){

    console.error(error);

    box.innerHTML =

      "<div class='card'>" +

      "Không tải được dữ liệu thu chi." +

      "</div>";

    return;

  }

  box.innerHTML = "";

  data.forEach(record => {

    const item =

      document.createElement("div");

    item.className =

      "card";

    item.innerHTML =

      "<h3>💰 " +

      escapeHtml(record.note || "") +

      "</h3>" +

      "<p>💵 " +

      Number(record.amount || 0)

        .toLocaleString("vi-VN") +

      " đ</p>" +

      "<p>📌 Loại: " +

      escapeHtml(record.type || "") +

      "</p>";

    box.appendChild(item);

  });

}
async function addMoney(){

  const note =
    document.getElementById(
      "moneyNote"
    ).value.trim();

  const amount =
    Number(
      document.getElementById(
        "moneyAmount"
      ).value
    );


  if(!note){

    alert(
      "Vui lòng nhập nội dung."
    );

    return;
  }


  if(!amount || amount <= 0){

    alert(
      "Vui lòng nhập số tiền hợp lệ."
    );

    return;
  }


  if(!supabaseClient){

    alert(
      "Chưa kết nối được Supabase."
    );

    return;
  }


  const { error } =
    await supabaseClient
      .from("Money")
      .insert([
        {
          type: "thu",
          amount: amount,
          note: note
        }
      ]);


  if(error){

    console.error(error);

    alert(
      "Không thể lưu khoản tiền:\n" +
      error.message
    );

    return;
  }


  alert(
    "Đã lưu khoản tiền!"
  );


  document.getElementById(
    "moneyNote"
  ).value = "";

  document.getElementById(
    "moneyAmount"
  ).value = "";


  loadMoney();

}
    


    // ============================
    // BẢO VỆ HTML
    // ============================

    function escapeHtml(text){

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        String(text ?? "");

      return div.innerHTML;

    }

  </script>

</body>
</html>
