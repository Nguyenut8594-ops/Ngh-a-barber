<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL =
  "https://nwnbwhgxeidbclpywzpe.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_as-NhQ3Bzc9WL4rza6latg_eUNCOP9r";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


// ============================
// ĐĂNG NHẬP
// ============================

function login(){

  const u =
    document.getElementById('user').value.trim();

  const p =
    document.getElementById('pass').value;

  if(
    (u === 'chủ' || u === 'chu') &&
    p === '1234'
  ){

    document.getElementById('hello').textContent =
      'Chủ tiệm';

    openApp();

  }

  else if(
    u === 'nv1' &&
    p === '1234'
  ){

    document.getElementById('hello').textContent =
      'Nhân viên An';

    openApp();

  }

  else{

    alert(
      'Tài khoản hoặc mật khẩu chưa đúng.\n\n' +
      'Bản mẫu:\n' +
      'chủ / 1234\n' +
      'nv1 / 1234'
    );

  }

}


// ============================
// MỞ ỨNG DỤNG
// ============================

function openApp(){

  document.getElementById('login').style.display =
    'none';

  document.getElementById('app').style.display =
    'block';

  const nav =
    document.getElementById('nav');

  if(nav){
    nav.style.display = 'grid';
  }

  loadEmployees();

}


// ============================
// CHUYỂN TRANG
// ============================

function show(id, el){

  document.querySelectorAll('.page')
    .forEach(page => {
      page.classList.remove('active');
    });

  const page =
    document.getElementById(id);

  if(page){
    page.classList.add('active');
  }

  document.querySelectorAll('.nav button')
    .forEach(button => {
      button.classList.remove('active');
    });

  if(el){
    el.classList.add('active');
  }

  if(id === 'employees'){
    loadEmployees();
  }

  if(id === 'money'){
    loadMoney();
  }

  if(id === 'services'){
    loadServiceRecords();
  }

}


// ============================
// TẢI NHÂN VIÊN
// ============================

async function loadEmployees(){

  const list =
    document.getElementById('employeeList');

  if(!list){
    return;
  }

  list.innerHTML =
    '<div class="muted small">Đang tải nhân viên...</div>';

  const { data, error } =
    await supabaseClient
      .from('employees')
      .select('*')
      .order(
        'created_at',
        { ascending: true }
      );

  if(error){

    console.error(error);

    list.innerHTML =
      '<div class="muted small">' +
      'Không tải được danh sách nhân viên.' +
      '</div>';

    return;
  }

  if(!data || data.length === 0){

    list.innerHTML =
      '<div class="muted small">' +
      'Chưa có nhân viên nào.' +
      '</div>';

    const count =
      document.getElementById('employeeCount');

    if(count){
      count.textContent = '0';
    }

    return;
  }

  const count =
    document.getElementById('employeeCount');

  if(count){
    count.textContent = data.length;
  }

  list.innerHTML = '';

  data.forEach(employee => {

    const name =
      employee.Name ||
      employee.name ||
      'Nhân viên';

    const firstLetter =
      name.trim().charAt(0).toUpperCase();

    const item =
      document.createElement('div');

    item.className = 'employee';

    item.innerHTML = `

      <div class="avatar">
        ${escapeHtml(firstLetter)}
      </div>

      <div style="flex:1">

        <b>
          ${escapeHtml(name)}
        </b>

        <div class="muted small">
          Barber • Đang làm
        </div>

      </div>

      <span class="tag">
        Có mặt
      </span>

      <button
        type="button"
        onclick="deleteEmployee('${employee.id}')"
        style="
          margin-left:10px;
          border:0;
          border-radius:8px;
          padding:6px 9px;
          cursor:pointer;
        "
      >
        🗑️
      </button>

    `;

    list.appendChild(item);

  });

}


// ============================
// THÊM NHÂN VIÊN
// ============================

async function addEmployee(){

  const name =
    prompt('Nhập tên nhân viên:');

  if(
    !name ||
    !name.trim()
  ){
    return;
  }

  const cleanName =
    name.trim();

  const { error } =
    await supabaseClient
      .from('employees')
      .insert([
        {
          Name: cleanName
        }
      ]);

  if(error){

    console.error(error);

    alert(
      'Không thêm được nhân viên.\n\n' +
      error.message
    );

    return;
  }

  alert(
    'Đã thêm nhân viên ' +
    cleanName
  );

  loadEmployees();

}


// ============================
// XÓA NHÂN VIÊN
// ============================

async function deleteEmployee(id){

  if(
    !confirm(
      'Bạn có chắc muốn xóa nhân viên này?'
    )
  ){
    return;
  }

  const { error } =
    await supabaseClient
      .from('employees')
      .delete()
      .eq('id', id);

  if(error){

    alert(
      'Lỗi: ' +
      error.message
    );

    return;
  }

  alert(
    'Đã xóa nhân viên!'
  );

  loadEmployees();

}


// ============================
// THÊM DỊCH VỤ
// ============================

async function addService(){

  const serviceSelect =
    document.getElementById('serviceName');

  if(!serviceSelect){

    alert(
      'Không tìm thấy ô chọn dịch vụ.'
    );

    return;
  }

  const serviceName =
    serviceSelect.value;

  const selectedOption =
    serviceSelect.options[
      serviceSelect.selectedIndex
    ];

  const price =
    Number(
      selectedOption?.dataset?.price || 0
    );

  const quantity =
    Number(
      document.getElementById(
        'serviceQuantity'
      )?.value || 0
    );

  if(!quantity || quantity <= 0){

    alert(
      'Vui lòng nhập số lượng!'
    );

    return;
  }

  const employeeName =
    document.getElementById(
      'hello'
    )?.textContent.trim() ||
    'Nhân viên';

  const total =
    price * quantity;

  const commission =
    total * 0.5;

  const { error } =
    await supabaseClient
      .from('service_records')
      .insert({

        employee_name:
          employeeName,

        service_name:
          serviceName,

        price:
          price,

        quantity:
          quantity,

        commission:
          commission

      });

  if(error){

    console.error(error);

    alert(
      'Lỗi lưu dịch vụ: ' +
      error.message
    );

    return;
  }

  alert(
    'Đã lưu ' +
    quantity +
    ' ' +
    serviceName +
    ' — Hoa hồng: ' +
    commission.toLocaleString('vi-VN') +
    'đ'
  );

  const quantityInput =
    document.getElementById(
      'serviceQuantity'
    );

  if(quantityInput){
    quantityInput.value = 1;
  }

  loadServiceRecords();

}


// ============================
// TẢI GIAO DỊCH DỊCH VỤ
// ============================

async function loadServiceRecords(){

  const list =
    document.getElementById(
      'serviceList'
    );

  if(!list){
    return;
  }

  const { data, error } =
    await supabaseClient
      .from('service_records')
      .select('*')
      .order(
        'created_at',
        { ascending: false }
      );

  if(error){

    console.error(error);

    list.innerHTML =
      '<div class="muted small">' +
      'Không tải được dịch vụ.' +
      '</div>';

    return;
  }

  if(!data || data.length === 0){

    list.innerHTML =
      '<div class="muted small">' +
      'Chưa có dịch vụ nào.' +
      '</div>';

    return;
  }

  list.innerHTML = '';

  data.forEach(item => {

    const total =
      Number(item.price || 0) *
      Number(item.quantity || 0);

    const row =
      document.createElement('div');

    row.className = 'card';

    row.innerHTML = `

      <b>
        ${escapeHtml(
          item.service_name ||
          'Dịch vụ'
        )}
      </b>

      <div class="muted small">
        ${escapeHtml(
          item.employee_name ||
          'Nhân viên'
        )}
      </div>

      <div class="num">
        ${total.toLocaleString('vi-VN')}đ
      </div>

      <div class="muted small">
        Số lượng:
        ${Number(item.quantity || 0)}
      </div>

      <div class="muted small">
        Hoa hồng:
        ${Number(
          item.commission || 0
        ).toLocaleString('vi-VN')}đ
      </div>

    `;

    list.appendChild(row);

  });

}


// ============================
// THÊM GIAO DỊCH TIỀN
// ============================

async function addMoney(){

  try{

    const type =
      document.getElementById(
        'moneyType'
      )?.value;

    const amount =
      Number(
        document.getElementById(
          'moneyAmount'
        )?.value
      );

    const note =
      document.getElementById(
        'moneyNote'
      )?.value.trim() || '';

    if(!amount || amount <= 0){

      alert(
        'Vui lòng nhập số tiền!'
      );

      return;
    }

    const { error } =
      await supabaseClient
        .from('money')
        .insert({

          type:
            type,

          amount:
            amount,

          note:
            note

        });

    if(error){

      console.error(error);

      alert(
        'Supabase báo lỗi:\n' +
        error.message
      );

      return;
    }

    alert(
      'Đã lưu giao dịch!'
    );

    document.getElementById(
      'moneyAmount'
    ).value = '';

    document.getElementById(
      'moneyNote'
    ).value = '';

    loadMoney();

  }
  catch(error){

    console.error(error);

    alert(
      'Lỗi JavaScript:\n' +
      error.message
    );

  }

}


// ============================
// XÓA GIAO DỊCH
// ============================

async function deleteMoney(id){

  if(
    !confirm(
      'Bạn có chắc muốn xóa giao dịch này?'
    )
  ){
    return;
  }

  const { error } =
    await supabaseClient
      .from('money')
      .delete()
      .eq('id', id);

  if(error){

    alert(
      'Lỗi: ' +
      error.message
    );

    return;
  }

  alert(
    'Đã xóa giao dịch!'
  );

  loadMoney();

}


// ============================
// TẢI GIAO DỊCH
// ============================

async function loadMoney(){

  const list =
    document.getElementById(
      'moneyList'
    );

  if(!list){
    return;
  }

  const { data, error } =
    await supabaseClient
      .from('money')
      .select('*')
      .order(
        'created_at',
        { ascending: false }
      );

  if(error){

    console.error(error);

    alert(
      'Lỗi tải dữ liệu: ' +
      error.message
    );

    return;
  }

  let income = 0;
  let expense = 0;

  list.innerHTML = '';

  if(!data || data.length === 0){

    list.innerHTML =
      '<div class="muted small">' +
      'Chưa có giao dịch nào.' +
      '</div>';

    setMoneyTotal(
      'totalIncome',
      0
    );

    setMoneyTotal(
      'totalExpense',
      0
    );

    setMoneyTotal(
      'totalBalance',
      0
    );

    return;
  }

  data.forEach(item => {

    const amount =
      Number(
        item.amount || 0
      );

    if(
      item.type === 'income'
    ){

      income += amount;

    }
    else{

      expense += amount;

    }

    const row =
      document.createElement('div');

    row.className = 'card';

    row.innerHTML = `

      <b>
        ${
          item.type === 'income'
            ? '💰 Thu'
            : '💸 Chi'
        }
      </b>

      <div class="num">
        ${amount.toLocaleString('vi-VN')}đ
      </div>

      <div class="muted small">
        ${escapeHtml(
          item.note ||
          'Không có ghi chú'
        )}
      </div>

      <button
        type="button"
        onclick="deleteMoney('${item.id}')"
        style="
          margin-top:10px;
          border:0;
          border-radius:8px;
          padding:7px 12px;
          cursor:pointer;
        "
      >
        🗑️ Xóa giao dịch
      </button>

    `;

    list.appendChild(row);

  });

  setMoneyTotal(
    'totalIncome',
    income
  );

  setMoneyTotal(
    'totalExpense',
    expense
  );

  setMoneyTotal(
    'totalBalance',
    income - expense
  );

}


// ============================
// HIỂN THỊ TỔNG TIỀN
// ============================

function setMoneyTotal(id, value){

  const element =
    document.getElementById(id);

  if(element){

    element.textContent =
      Number(value).toLocaleString(
        'vi-VN'
      ) + 'đ';

  }

}


// ============================
// BẢO VỆ HTML
// ============================

function escapeHtml(text){

  const div =
    document.createElement('div');

  div.textContent =
    String(text ?? '');

  return div.innerHTML;

}

</script>
</body>
</html>
